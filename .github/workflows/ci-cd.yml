name: CI/CD - Chatbotai

permissions:
  contents: write
  security-events: write
  
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'terraform/**'
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v --tb=short

      - name: Check code formatting
        run: |
          pip install black
          black --check app.py test_app.py || true

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ vars.IMAGE_NAME }}:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ vars.IMAGE_NAME }}:${{ github.sha }}"
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Scan for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git file:///repo \
            --only-verified \
            --fail

  build-push:
    name: 📦 Build & Push Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy-gitops:
    name: 🚀 GitOps Deployment
    needs: build-push
    runs-on: ubuntu-latest
  
    permissions:
      contents: write
  
    if: github.ref == 'refs/heads/main'
  
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
  
      - name: Update Deployment Image
        run: |
          sed -i "s|image: .*|image: ${{ vars.IMAGE_NAME }}:${{ github.sha }}|g" \
          k8s/deployment.yaml
  
      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
  
          git add k8s/deployment.yaml
  
          git commit -m "Deploy image ${{ github.sha }}" || exit 0
  
      - name: Push Changes
        run: git push

      - name: Notify
        if: always()
        run: |
          echo "GitOps update completed"
          echo "Status : ${{ job.status }}"
          echo "Image  : ${{ vars.IMAGE_NAME }}:${{ github.sha }}"
          echo "ArgoCD will detect the new commit and deploy it."
          
