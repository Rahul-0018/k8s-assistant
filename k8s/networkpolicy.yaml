apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chatbotai-netpol
  namespace: chatbotai
spec:
  podSelector:
    matchLabels:
      app: chatbotai
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Allow DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow Groq API
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
